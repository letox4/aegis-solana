[package]
name = "aegis402"
version = "0.1.0"
description = "Aegis402: Trustless Bug Bounty Vaults (Commit-Reveal), Whitehat Reputation & x402 Audit Attestations on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis402"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
